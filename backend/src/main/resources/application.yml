spring:
  application:
    name: proximo-backend
  profiles:
    active: dev

server:
  port: 8080

proximo:
  fuseau: "Africa/Kinshasa"
  horaires:
    ouverture-commandes: "07:30"
    fermeture-commandes: "15:30"
    remise-a-zero: "16:30"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:proximodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/proximo}
    username: ${SPRING_DATASOURCE_USERNAME:proximo}
    password: ${SPRING_DATASOURCE_PASSWORD:proximo}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
